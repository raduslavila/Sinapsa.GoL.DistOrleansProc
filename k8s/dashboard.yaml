# ── Dedicated Orleans Dashboard Silo ────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gol-dashboard
  namespace: gol
  labels:
    app: gol-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gol-dashboard
  template:
    metadata:
      labels:
        app: gol-dashboard
    spec:
      serviceAccountName: gol-backend-sa
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: wait-for-backend-membership
          image: bitnami/kubectl:latest
          command:
            - sh
            - -c
            - kubectl wait --for=condition=Ready pod -l app=gol-backend -n gol --timeout=180s
        - name: wait-for-redis
          image: redis:7-alpine
          command:
            - sh
            - -c
            - until redis-cli -h redis -p 6379 ping; do echo 'waiting for redis'; sleep 2; done
      containers:
        - name: gol-dashboard
          image: gol-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5050
              name: http
            - containerPort: 11111
              name: silo
            - containerPort: 30000
              name: gateway
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: ClusterConfig__ClusterOptions__ClusterId
              value: "k8s-gol"
            - name: ClusterConfig__ClusterOptions__ServiceId
              value: "k8s-gol-one"
            - name: ClusterConfig__UseLocalhost
              value: "false"
            - name: ClusterConfig__UseKubernetesHosting
              value: "true"
            - name: ClusterConfig__UseDashboard
              value: "true"
            - name: ClusterConfig__DashboardPort
              value: "8000"
            - name: ClusterConfig__DashboardPath
              value: "dashboard"
            - name: ConnectionStrings__redis
              value: "redis:6379,abortConnect=false"
            - name: UseMemoryGrainStorage
              value: "true"
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /hc
              port: 5050
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /hc
              port: 5050
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /hc
              port: 5050
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: gol-dashboard
  namespace: gol
spec:
  selector:
    app: gol-dashboard
  ports:
    - name: http
      port: 5050
      targetPort: 5050
---
apiVersion: v1
kind: Service
metadata:
  name: gol-dashboard-external
  namespace: gol
spec:
  type: NodePort
  selector:
    app: gol-dashboard
  ports:
    - name: http
      port: 5050
      targetPort: 5050
      nodePort: 30051
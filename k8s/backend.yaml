# ── Orleans Silo Deployment (4 replicas) ────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gol-backend
  namespace: gol
  labels:
    app: gol-backend
spec:
  replicas: 4
  selector:
    matchLabels:
      app: gol-backend
  template:
    metadata:
      labels:
        app: gol-backend
    spec:
      serviceAccountName: gol-backend-sa
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: wait-for-redis
          image: redis:7-alpine
          command:
            - sh
            - -c
            - until redis-cli -h redis -p 6379 ping; do echo 'waiting for redis'; sleep 2; done
      containers:
        - name: gol-backend
          image: gol-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5050
              name: http
            - containerPort: 11111
              name: silo
            - containerPort: 30000
              name: gateway
          env:
            # --- Pod identity (required by Orleans.Hosting.Kubernetes) ---
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # --- Orleans cluster identity (bound into ClusterConfig.ClusterOptions via config) ---
            - name: ClusterConfig__ClusterOptions__ClusterId
              value: "k8s-gol"
            - name: ClusterConfig__ClusterOptions__ServiceId
              value: "k8s-gol-one"
            # --- Application config overrides (double-underscore = nested JSON) ---
            - name: ClusterConfig__UseLocalhost
              value: "false"
            - name: ClusterConfig__UseKubernetesHosting
              value: "true"
            - name: ClusterConfig__UseDashboard
              value: "true"
            - name: ClusterConfig__DashboardPort
              value: "8000"
            - name: ClusterConfig__DashboardPath
              value: "dashboard"
            - name: ConnectionStrings__redis
              value: "redis:6379,abortConnect=false"
            - name: UseMemoryGrainStorage
              value: "true"
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /hc
              port: 5050
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /hc
              port: 5050
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /hc
              port: 5050
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
---
# Internal ClusterIP — used by the frontend nginx proxy and inter-silo comms
apiVersion: v1
kind: Service
metadata:
  name: gol-backend
  namespace: gol
spec:
  selector:
    app: gol-backend
  ports:
    - name: http
      port: 5050
      targetPort: 5050
    - name: silo
      port: 11111
      targetPort: 11111
    - name: gateway
      port: 30000
      targetPort: 30000
---
# NodePort — exposes the API outside the cluster
apiVersion: v1
kind: Service
metadata:
  name: gol-backend-external
  namespace: gol
spec:
  type: NodePort
  selector:
    app: gol-backend
  ports:
    - name: http
      port: 5050
      targetPort: 5050
      nodePort: 30050

# ── RedisInsight for inspecting Redis persistence ───────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-insight
  namespace: gol
  labels:
    app: redis-insight
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-insight
  template:
    metadata:
      labels:
        app: redis-insight
    spec:
      initContainers:
        - name: wait-for-redis
          image: redis:7-alpine
          command:
            - sh
            - -c
            - until redis-cli -h redis -p 6379 ping; do echo 'waiting for redis'; sleep 2; done
      containers:
        - name: redis-insight
          image: redis/redisinsight:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5540
              name: http
          env:
            - name: RI_REDIS_HOSTS
              value: 'redis'
          readinessProbe:
            tcpSocket:
              port: 5540
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5540
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: redis-insight
  namespace: gol
spec:
  type: NodePort
  selector:
    app: redis-insight
  ports:
    - name: http
      port: 5540
      targetPort: 5540
      nodePort: 30054
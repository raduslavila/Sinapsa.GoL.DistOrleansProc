# Kind cluster configuration with host port mappings
# Ingress controller → http://gol.local (frontend / api / dashboard / redisinsight)
# NodePort 30000 → localhost:30000  (frontend fallback)
# NodePort 30050 → localhost:30050  (backend API fallback)
# NodePort 30054 → localhost:30054  (RedisInsight fallback)
#
# Usage:
#   kind create cluster --name gol --config kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      - containerPort: 30000
        hostPort: 30000
        protocol: TCP
      - containerPort: 30050
        hostPort: 30050
        protocol: TCP
      - containerPort: 30054
        hostPort: 30054
        protocol: TCP
  - role: worker
  - role: worker
